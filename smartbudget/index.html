        <section class="section" id="fonctionnalites">
          <div class="container">
            <div class="section-head">
              <span class="eyebrow"><b>Produit</b> Tout au même endroit</span>
              <h2 class="section-title">Un budget qui travaille pour vous, pas l'inverse.</h2>
              <p class="section-sub">
                Du salaire qui tombe au dernier café du mois, SmartBudget relie chaque mouvement à
                une décision. Vous voyez ce qui reste réellement disponible, pas seulement ce qui est
                déjà dépensé.
              </p>
            </div>

              </article>
              <article class="feature-card">
                <span class="feature-ic"><span data-icon="receipt"></span></span>
                <h3>Dépenses sans angle mort</h3>
                <p>Charges fixes, abonnements et dépenses variables. Les factures à venir restent visibles avant l'oubli.</p>
              </article>

                <span class="feature-tag">Automatique</span>
                <span class="feature-ic"><span data-icon="chart"></span></span>
                <h3>Enveloppes 50/30/20</h3>

              </article>

              </article>

                  <span class="eyebrow"><b>Méthode</b> Simple et éprouvée</span>
                  <h2>Un salaire. Trois enveloppes. Zéro culpabilité.</h2>
                  <p>
                    La règle 50/30/20 donne une intention à chaque euro : la moitié pour l'essentiel,
                    un tiers pour ce qui rend la vie agréable, un cinquième pour demain. SmartBudget
                    la calcule sur vos revenus réels et suit vos écarts, mois après mois.
                  </p>
                  <div class="rule-bars">

                  <div class="rule-card">

                  <div class="rule-card">

                <span data-arrow></span>

              <article class="step">

        <section class="section" id="securite">
          <div class="container security-grid">
            <div>
              <span class="eyebrow"><b>Sécurité</b> Vos données, votre contrôle</span>
              <h2 class="section-title">Une base solide, pas un pari.</h2>
              <p class="section-sub">
                SmartBudget est conçu pour Supabase : PostgreSQL, authentification et Row Level
                Security. En démo, rien ne quitte votre navigateur. En production, chaque requête
                est filtrée par utilisateur.
              </p>
              <div class="security-list">
                <div class="security-item">
                  <span data-icon="lock"></span>
                  <div><strong>Row Level Security activée</strong><p>Chaque table est cloisonnée : vous ne pouvez lire et modifier que vos propres lignes.</p></div>
                </div>
                <div class="security-item">
                  <span data-icon="shield"></span>
                  <div><strong>Aucune clé secrète côté client</strong><p>Seule la clé publique est utilisée. Les règles métier vivent dans PostgreSQL.</p></div>
                </div>
                <div class="security-item">
                  <span data-icon="download"></span>
                  <div><strong>Export et suppression</strong><p>Bilan CSV, PDF, export complet JSON et suppression définitive du compte.</p></div>
                </div>
              </div>
            </div>
            <div class="code-card" aria-label="Exemple de politique de sécurité">
              <div class="code-head">
                <span><span data-icon="shield"></span> supabase / policies.sql</span>
                <span>RLS</span>
              </div>
              <pre class="code-body"><code><span class="c">-- Chaque utilisateur ne voit que ses dépenses</span>
<span class="k">alter table</span> expenses
  <span class="k">enable row level security</span>;

<span class="k">create policy</span> <span class="s">"own_expenses"</span>
<span class="k">on</span> expenses <span class="k">for all</span>
<span class="k">using</span> ((<span class="k">select</span> auth.uid()) = user_id)
<span class="k">with check</span> ((<span class="k">select</span> auth.uid()) = user_id);</code></pre>
              <div class="code-foot"><span data-icon="check-circle"></span> 8 tables protégées · 32 politiques · triggers métier</div>
            </div>
          </div>
        </section>
